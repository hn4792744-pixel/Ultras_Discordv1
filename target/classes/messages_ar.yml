# Ultras_discord - الرسائل العربية (صيغة MiniMessage). المتغيرات مثل {player}.
prefix: "<dark_gray>[<gradient:#ff5555:#ffaa00>Ultras</gradient><dark_gray>] <gray>"

types:
  xray: "اكس راي"
  fly: "طيران"
  autoclicker: "أوتو كليكر"
  combat: "قتال"

levels:
  normal: "<green>طبيعي</green>"
  monitor: "<yellow>مراقبة</yellow>"
  suspicious: "<gold>مشبوه</gold>"
  high: "<red>شبهة عالية</red>"
  critical: "<dark_red><bold>حرج</bold></dark_red>"

patterns:
  consistent: "نقرات منتظمة جدًا"
  repeating: "نمط فواصل متكرر"
  burst: "نقرات متتابعة دفعة واحدة"
  mixed: "مختلط / غير معتاد"

reasons:
  xray:
    rare-rate: "معدل استخراج الخامات النادرة مرتفع جدًا ({value})"
    ore-ratio: "خامات كثيرة مقارنة بالبلوكات المحفورة ({value})"
    rare-share: "أغلب الخامات المستخرجة نادرة ({value})"
    reveal-ratio: "الحفر مباشرة نحو خامات مخفية ({value} من البلوكات)"
    find-interval: "العثور على خامات نادرة بسرعة غير طبيعية (كل {value})"
    vein-hopping: "التنقل بين عروق خامات كثيرة ({value})"
    generic: "مؤشرات تعدين مجتمعة"
  fly:
    hover: "التحليق في الهواء دون سقوط"
    ascend: "الصعود لارتفاع أعلى من القفز الطبيعي ({rise} بلوك)"
    speed: "سرعة في الهواء أعلى من الحد الطبيعي"
  autoclicker:
    cps: "سرعة نقر عالية جدًا ({value} CPS)"
    consistency: "فواصل النقر منتظمة أكثر من اللازم (التباين {value})"
    repetition: "نمط فواصل نقر متكرر ({value})"
    burst: "نقرات متعددة في نفس التيك ({value})"
    generic: "مؤشرات نقر مجتمعة"
  combat:
    kill-spam: "{kills} عمليات قتل خلال {minutes} دقائق"

general:
  no-permission: "<red>ليس لديك صلاحية لاستخدام هذا الأمر."
  player-only: "<red>هذا الأمر للاعبين فقط."
  unknown-player: "<red>لا توجد بيانات للاعب <white>{player}</white>."
  module-disabled: "<red>الوحدة <white>{module}</white> معطلة في config.yml."

commands:
  help:
    - "<gradient:#ff5555:#ffaa00><bold>Ultras_discord</bold></gradient> <gray>by UC_Hussein"
    - "<yellow>/xry_list <gray>- فتح واجهة الأمان"
    - "<yellow>/xry_list refresh <gray>- تحديث البيانات فورًا"
    - "<yellow>/ucsecurity reload <gray>- إعادة تحميل الإعدادات والرسائل وDiscord"
    - "<yellow>/ucsecurity refresh <gray>- تحديث الإحصائيات والواجهة"
    - "<yellow>/ucsecurity resetlogs all <gray>- حذف كل السجلات (مع تأكيد)"
    - "<yellow>/ucsecurity resetlogs <player> <gray>- حذف سجلات لاعب واحد"
    - "<yellow>/ucsecurity alerts <gray>- تشغيل/إيقاف تنبيهاتك"
    - "<yellow>/ucsecurity status <gray>- حالة الوحدات وDiscord"
    - "<yellow>/ucsecurity discordtest <gray>- إرسال رسالة اختبار إلى Discord"
  reloaded: "<green>تم إعادة تحميل الإعدادات والرسائل وإعدادات Discord."
  refreshed: "<green>تم تحديث البيانات."
  xry-usage: "<red>الاستخدام: /xry_list [refresh|open|stats|warnings|blocks|punish <لاعب>] | sword | ores | players"
  resetlogs-usage: "<red>الاستخدام: /ucsecurity resetlogs <all|لاعب>"
  resetlogs-confirm: "<red><bold>تحذير:</bold> سيتم حذف كل السجلات والإحصائيات والتحذيرات لجميع اللاعبين.</red> <click:run_command:'/ucsecurity resetlogs all confirm'><hover:show_text:'<gray>اضغط للتأكيد'><green><bold>[تأكيد]</bold></green></hover></click> <gray>(تنتهي خلال {seconds} ثانية)"
  resetlogs-none-pending: "<red>لا يوجد شيء لتأكيده (انتهت المهلة). نفذ <white>/ucsecurity resetlogs all</white> مرة أخرى."
  resetlogs-all-done: "<green>تم حذف كل السجلات (<white>{count}</white> لاعب)."
  resetlogs-player-done: "<green>تم حذف سجلات اللاعب <white>{player}</white>."
  alerts-on: "<green>تم تفعيل تنبيهات الستاف لك."
  alerts-off: "<yellow>تم إيقاف تنبيهات الستاف لك."
  punish-missing: "<red>خيار punishment-command فارغ في config.yml."
  discord-not-ready: "<red>Discord غير مفعل أو غير مُعدّ (راجع config.yml)."
  discord-test-sent: "<green>تمت إضافة رسالة الاختبار إلى قائمة الإرسال."
  status:
    - "<gradient:#ff5555:#ffaa00><bold>Ultras_discord</bold></gradient> <gray>v{version} - اللغة {language}"
    - "<gray>X-Ray: <white>{xray} <gray>Fly: <white>{fly} <gray>AutoClicker: <white>{autoclicker} <gray>Kills: <white>{kills}"
    - "<gray>Discord: <white>{discord} <gray>اللاعبون المتتبعون: <white>{players}"

console:
  alert: "[{type}] {player} - {suspicion}% ({level}) - {reason}"

alerts:
  xray:
    - ""
    - "<dark_red><bold>⚠ اشتباه X-RAY ⚠</bold></dark_red>"
    - "<gray>اللاعب: <white>{player} <dark_gray>({gamemode}, {world})"
    - "<gray>نسبة الشك: {level-mm} <white>{suspicion}%"
    - "<gray>دايموند: <aqua>{diamond} <gray>زمرد: <green>{emerald} <gray>ancient debris: <gold>{debris}"
    - "<gray>الخامات: <white>{ores} <gray>البلوكات: <white>{blocks} <gray>المعدل: <white>{rate} خام/دقيقة"
    - "<gray>الأسباب: <yellow>{reasons}"
    - "<click:run_command:'/xry_list open {uuid}'><hover:show_text:'<gray>فتح ملف اللاعب'><green><bold>[فتح اللاعب]</bold></green></hover></click> <click:run_command:'/{punish-command}'><hover:show_text:'<gray>ينفذ: /{punish-command}'><red><bold>[العقوبات]</bold></red></hover></click> <click:run_command:'/xry_list warnings {uuid}'><hover:show_text:'<gray>فتح التحذيرات'><yellow><bold>[التحذيرات]</bold></yellow></hover></click>"
    - ""
  fly:
    - ""
    - "<dark_red><bold>⚠ اشتباه FLY ⚠</bold></dark_red>"
    - "<gray>اللاعب: <white>{player} <dark_gray>({gamemode}, {world})"
    - "<gray>نسبة الشك: {level-mm} <white>{suspicion}%"
    - "<gray>الأسباب: <yellow>{reasons}"
    - "<click:run_command:'/xry_list open {uuid}'><hover:show_text:'<gray>فتح ملف اللاعب'><green><bold>[فتح اللاعب]</bold></green></hover></click> <click:run_command:'/{punish-command}'><hover:show_text:'<gray>ينفذ: /{punish-command}'><red><bold>[العقوبات]</bold></red></hover></click> <click:run_command:'/xry_list warnings {uuid}'><hover:show_text:'<gray>فتح التحذيرات'><yellow><bold>[التحذيرات]</bold></yellow></hover></click>"
    - ""
  autoclicker:
    - ""
    - "<dark_red><bold>⚠ اشتباه AUTOCLICKER ⚠</bold></dark_red>"
    - "<gray>اللاعب: <white>{player} <dark_gray>({gamemode}, {world})"
    - "<gray>نسبة الشك: {level-mm} <white>{suspicion}%"
    - "<gray>CPS: <white>{cps} <gray>النمط: <white>{pattern}"
    - "<gray>الأسباب: <yellow>{reasons}"
    - "<click:run_command:'/xry_list open {uuid}'><hover:show_text:'<gray>فتح ملف اللاعب'><green><bold>[فتح اللاعب]</bold></green></hover></click> <click:run_command:'/{punish-command}'><hover:show_text:'<gray>ينفذ: /{punish-command}'><red><bold>[العقوبات]</bold></red></hover></click> <click:run_command:'/xry_list warnings {uuid}'><hover:show_text:'<gray>فتح التحذيرات'><yellow><bold>[التحذيرات]</bold></yellow></hover></click>"
    - ""
  combat:
    - ""
    - "<dark_red><bold>⚠ تحذير قتال ⚠</bold></dark_red>"
    - "<gray>اللاعب: <white>{player} <dark_gray>({gamemode}, {world})"
    - "<gray>السبب: <yellow>{reason}"
    - "<click:run_command:'/xry_list open {uuid}'><hover:show_text:'<gray>فتح ملف اللاعب'><green><bold>[فتح اللاعب]</bold></green></hover></click> <click:run_command:'/{punish-command}'><hover:show_text:'<gray>ينفذ: /{punish-command}'><red><bold>[العقوبات]</bold></red></hover></click> <click:run_command:'/xry_list warnings {uuid}'><hover:show_text:'<gray>فتح التحذيرات'><yellow><bold>[التحذيرات]</bold></yellow></hover></click>"
    - ""
  details:
    xray:
      - "دايموند: {diamond} | زمرد: {emerald} | ancient debris: {debris}"
      - "الخامات: {ores} | البلوكات: {blocks} | المعدل: {rate} خام/دقيقة"
      - "الأسباب: {reasons}"
    fly:
      - "الوضع: {gamemode} | العالم: {world}"
      - "الأسباب: {reasons}"
    autoclicker:
      - "CPS: {cps} | النمط: {pattern}"
      - "الأسباب: {reasons}"
    combat:
      - "السبب: {reason}"

